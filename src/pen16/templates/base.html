<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}pen16{% endblock %}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="pen16">
<style>
:root { --bg: #fff; --fg: #1b1b1b; --muted: #666; --line: #ddd; --bad: #b3261e; --ok: #1e6b35; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141414; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333; --bad: #f28b82; --ok: #81c995; }
}
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 62rem; padding: 1rem; }
h1 { font-size: 1.3rem; margin: 0 0 1rem; }
h2 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; }
h3 { font-size: 1rem; margin: 1.2rem 0 .4rem; }
a { color: inherit; }
nav { margin: 0 0 1rem; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: .35rem .5rem .35rem 0; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.scroll { overflow-x: auto; }
dl { display: grid; gap: .2rem 1rem; grid-template-columns: max-content 1fr; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; }
input[type=text], select { font: inherit; max-width: 100%; padding: .25rem .4rem; }
button { font: inherit; padding: .3rem .8rem; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
form.inline { display: inline; }
</style>
</head>
<body>
<nav><a href="/">Dashboard</a> · <a href="/changes">Recent changes</a></nav>
{% block content %}{% endblock %}
<p class="muted">Signed in as {{ owner }}{% block signed_in %}{% endblock %}</p>
{% block scripts %}{% endblock %}
</body>
</html>
