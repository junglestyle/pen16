# pen16 on one host. Ansible renders /etc/pen16 (pen16.toml, pen16.env, listener.env, intake.env, runner.token,
# runner-scope.nft), runs the pen16-egress timer, and starts this file. See
# docs/ARCHITECTURE.md#deployment-and-state-ownership.
name: pen16

x-logging: &logging
  driver: journald

x-app: &app
  image: pen16:local
  # Only migrate builds it, so a deploy makes one image and every service runs it. With a build on each, compose
  # built one per service and tagged whichever finished last. Never pulled: it exists only once built here.
  pull_policy: never
  restart: unless-stopped
  logging: *logging
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    PEN16_CONFIG: /etc/pen16/pen16.toml
  volumes:
    - /etc/pen16/pen16.toml:/etc/pen16/pen16.toml:ro

x-core: &core
  <<: *app
  env_file: /etc/pen16/pen16.env
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    logging: *logging
    env_file: /etc/pen16/pen16.env
    volumes:
      - db:/var/lib/postgresql/data
    networks: [core, owner]
    healthcheck:
      test: pg_isready -U pen16
      interval: 5s
      retries: 30

  migrate:
    <<: *app
    build: ..
    pull_policy: missing
    env_file: /etc/pen16/pen16.env
    command: [migrate]
    restart: "no"
    networks: [core]
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *core
    command: [worker]
    networks: [core]

  # tailscale serve on the host proxies the tailnet to this localhost port and adds identity headers. It sits on
  # its own network with the database, so the intake and listener, which other machines reach, can't send it
  # identity headers of their own.
  web:
    <<: *core
    command: [web, --host, 0.0.0.0, --port, "8080"]
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /etc/pen16/pen16.toml:/etc/pen16/pen16.toml:ro
      - /var/lib/pen16/evidence:/var/lib/pen16/evidence:ro
    networks: [owner]

  # Hosts push compliance results here. tailscale serve puts it on its own tailnet port; it takes compliance
  # tokens only and serves nothing else. It logs in to the database as its own role (pen16.roles), so
  # intake.env holds that role's URL and nothing else.
  intake:
    <<: *core
    env_file: /etc/pen16/intake.env
    command: [intake, --host, 0.0.0.0, --port, "8444"]
    ports:
      - 127.0.0.1:8444:8444
    volumes:
      - /etc/pen16/pen16.toml:/etc/pen16/pen16.toml:ro
      - /var/lib/pen16/evidence:/var/lib/pen16/evidence
    # Uploads past 1 MB spool to /tmp while they're parsed, and the image is read-only. Sized for the largest
    # upload the intake takes (evidence.MAX_COMPRESSED, 50 MB) with the playbook beside it.
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [core]

  # The runner's only way in. Like the intake, it logs in as its own role, from listener.env.
  listener:
    <<: *core
    env_file: /etc/pen16/listener.env
    command: [listener, --host, 0.0.0.0, --port, "8443"]
    volumes:
      - /etc/pen16/pen16.toml:/etc/pen16/pen16.toml:ro
      - /var/lib/pen16/evidence:/var/lib/pen16/evidence
      # The host's neighbour table, written by the pen16-neighbours service, for each target's MAC.
      - /run/pen16-neighbours:/run/pen16-neighbours:ro
    networks:
      core: {}
      runner:
        ipv4_address: 172.30.15.2

  # No database credentials and no route to anything but the listener and scan targets. The host loads
  # deploy/runner-egress.nft into this container's namespace before it runs a job (deploy/pen16-egress).
  runner:
    <<: *app
    command: [runner]
    # nmap's raw sockets need root inside the container; NET_RAW is the only capability it keeps.
    user: root
    cap_add: [NET_RAW]
    labels:
      pen16.role: runner
    environment:
      PEN16_CONFIG: /etc/pen16/pen16.toml
      PEN16_LISTENER_URL: http://172.30.15.2:8443
    volumes:
      - /etc/pen16/pen16.toml:/etc/pen16/pen16.toml:ro
      - /etc/pen16/runner.token:/etc/pen16/runner.token:ro
      - /run/pen16-egress:/run/pen16-egress:ro
    networks: [runner]

networks:
  core: {}
  # The dashboard and the database only.
  owner: {}
  runner:
    driver_opts:
      com.docker.network.bridge.name: pen16-runner
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.15.0/24
          # Dynamic addresses stay above .128, so a runner started first can't take the listener's .2.
          ip_range: 172.30.15.128/25
          gateway: 172.30.15.1

volumes:
  db: {}
