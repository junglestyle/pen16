[project]
name = "pen16"
version = "0.0.0"
description = "Low-touch security dashboard for a homelab and home network"
license = "MIT"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20",
    "defusedxml>=0.7",
    "fastapi>=0.162",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54",
]

[project.scripts]
pen16 = "pen16.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
packages = ["pen16", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
