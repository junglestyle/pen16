[project]
name = "pen16"
version = "0.0.0"
description = "Low-touch security dashboard for a homelab and home network"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "defusedxml",
    "fastapi",
    "httpx",
    "jinja2",
    "psycopg[binary]",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

[project.scripts]
pen16 = "pen16.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
packages = ["pen16", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
